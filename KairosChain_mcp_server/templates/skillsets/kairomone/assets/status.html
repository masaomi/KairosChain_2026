  function text(id, value) { node(id).textContent = value; }
  function show(id, visible) { node(id).hidden = !visible; }
  function empty(parent) { while (parent.firstChild) parent.removeChild(parent.firstChild); }
  function make(tag, className, value) {
    var element = document.createElement(tag);
    if (className) element.className = className;
    if (value !== undefined) element.textContent = value;
    return element;
  }
  function fill(template, values) { return template.replace(/\{(\w)\}/g, function (_, key) { return values[key]; }); }
  function when(value) { return string(value).replace('T', ' ').replace(/\.\d+/, '').replace(/Z$/, ' UTC') || '—'; }
  function renderHero(data, w) {
    var name = string(data.name) || 'Kairomone', lv = level(data.level), drawing = object(data.drawing);
    var uri = picture(drawing.data_uri), drawn = drawing.shown === 'drawing', image = node('hero-image');
    document.title = name + ' · Kairomone ' + w.pageTitle;
    text('name', name);
    text('hero-stage', named(data.stage) || w.stageUnknown);
    text('hero-level', w.level + ' ' + (lv ? String(lv) : '—'));
    // Art is shown only as an image from a data: URI the snapshot holds (Inv 6).
    if (uri) { image.setAttribute('src', uri); image.setAttribute('alt', drawn ? string(drawing.form) || w.drawingAlt : w.eggAlt); }
    image.hidden = !uri;
    show('hero-placeholder', !uri);
    text('hero-caption', drawn ? (uri ? string(drawing.form) || w.drawingAlt : w.drawingWithheld) : (uri ? w.eggCaption : w.noImage));
    text('generated-at', when(data.generated_at));
    node('generated-at').setAttribute('datetime', string(data.generated_at));
  }
  function renderHistory(data, w) {
    var parent = node('history'), items = list(data.drawings).slice(-30);
    empty(parent);
    items.forEach(function (value) {
      var item = object(value), uri = item.missing === true ? '' : picture(item.data_uri), lv = level(item.level);
      var label = lv ? w.level + ' ' + lv : named(item.stage) || w.whenUnknown;
      var li = make('li', uri ? 'drawing' : 'drawing missing'), frame = make('div', 'frame');
      if (uri) {
        var image = make('img');
        image.setAttribute('src', uri);
        image.setAttribute('alt', (string(item.form) || w.drawingAlt) + ' · ' + label);
        frame.appendChild(image);
      } else {
        frame.appendChild(make('span', 'missing-mark', w.missing));
      }
      li.appendChild(frame);
      li.appendChild(make('span', 'when', label));
      if (string(item.form)) li.appendChild(make('span', 'form', item.form));
      parent.appendChild(li);
    });
    show('history-empty', !items.length);
  }
  function renderCounts(data, w) {
    var counts = object(data.counts);
    text('count-lifetime', count(counts.lifetime_cycles));
    text('lifetime-note', count(counts.lifetime_cycles) === '—' ? w.lifetimeUnknown : w.lifetimeNote);
    text('count-sources', count(counts.learned_sources));
    text('count-l1', count(counts.own_growth_l1));
    text('count-l2', count(counts.own_growth_l2));
  }
  function renderProfession(data, w) {
    var profession = object(data.profession), parent = node('lineage');
    var names = list(profession.lineage).filter(function (value) { return string(value); }).slice(0, 32);
    text('profession-name', string(profession.name) || (profession.chosen === true ? w.professionWithheld : w.noProfession));
    empty(parent);
    names.forEach(function (value) { parent.appendChild(make('li', 'chip', value)); });
    if (!names.length) parent.appendChild(make('li', 'chip quiet', w.lineageEmpty));
  }
  function renderCycles(data, w) {
    var parent = node('cycles'), cycles = list(data.cycles).slice(0, 100), total = object(data.counts).own_growth_l1;
    empty(parent);
    cycles.forEach(function (value) {
      var cycle = object(value), li = make('li', 'cycle'), chips = make('ul', 'chips'), sources = make('ul', 'sources');
      var subjects = list(cycle.subjects).map(named).filter(function (name) { return name; });
      subjects.forEach(function (name) { chips.appendChild(make('li', 'chip', name)); });
      if (!subjects.length) chips.appendChild(make('li', 'chip quiet', w.noSubjects));
      li.appendChild(chips);
      li.appendChild(make('h3', '', string(cycle.title) || w.untitled));
      if (string(cycle.finding)) {
        li.appendChild(make('p', 'label', w.finding));
        li.appendChild(make('p', 'finding', cycle.finding));
      }
      if (string(cycle.synthesis)) {
        var details = make('details');
        details.appendChild(make('summary', '', w.readSynthesis));
        details.appendChild(make('p', 'synthesis', cycle.synthesis));
        li.appendChild(details);
      }
      // Source addresses are text: nothing here links or loads.
      var urls = list(cycle.sources).filter(function (url) { return string(url); }).slice(0, 50);
      urls.forEach(function (url) { sources.appendChild(make('li', '', url)); });
      if (!urls.length) sources.appendChild(make('li', 'quiet', w.noSources));
      li.appendChild(make('p', 'label', w.sources));
      li.appendChild(sources);
      parent.appendChild(li);
    });
    show('cycles-empty', !cycles.length);
    var more = Number.isSafeInteger(total) && total > cycles.length && cycles.length > 0;
    text('cycles-more', more ? fill(w.cyclesMore, { n: cycles.length, m: total }) : '');
    show('cycles-more', more);
  }
  function render() {
    var w = words[locale];
    document.documentElement.lang = locale;
    document.querySelectorAll('[data-i18n]').forEach(function (element) { element.textContent = w[element.getAttribute('data-i18n')] || ''; });
    ['ja', 'en'].forEach(function (lang) { node('lang-' + lang).setAttribute('aria-pressed', String(locale === lang)); });
    show('content', !failed);
    show('data-error', failed);
    if (failed) { text('data-error', w.error); text('footer-made', ''); return; }
    var data = object(snapshot);
    renderHero(data, w);
    renderHistory(data, w);
    renderCounts(data, w);
    renderProfession(data, w);
    renderCycles(data, w);
    var withheld = Number.isSafeInteger(data.withheld) && data.withheld > 0;
    text('withheld', withheld ? fill(w.withheld, { n: data.withheld }) : '');
    show('withheld', withheld);
    text('footer-made', fill(w.footerMade, { v: string(data.version) || '—' }));
  }
  try {
    snapshot = JSON.parse(node('kairomone-status').textContent);
    if (!snapshot || typeof snapshot !== 'object' || Array.isArray(snapshot) || snapshot.schema !== SCHEMA) failed = true;
  } catch (_) { failed = true; }
  node('lang-ja').addEventListener('click', function () { locale = 'ja'; render(); });
  node('lang-en').addEventListener('click', function () { locale = 'en'; render(); });
  render();
}());
</script>
</body>
</html>
