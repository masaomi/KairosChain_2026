# Multi-LLM Review SkillSet configuration
#
# This is the canonical reviewer roster. agent.yml delegates here
# to avoid duplication.

# Convergence rules
#
# READ THIS FIRST: the ratio below is NOT the condition on which a round
# closes. Consensus.compute returns it as `reference_verdict` (v0.7 INV-R2) —
# a recorded observation. A round closes on the exhaustion of (a)+(b) findings,
# declared by the operator, and the machine-side signal is "new (a)+(b) P0 = 0",
# which nothing in this SkillSet computes and no returned field carries. Both
# 2026-08 review threads closed that way without ever reaching their ratio. See
# L1 multi_llm_review_workflow § Convergence Rules.
#
# Roster has 4 reviewers (claude_cli_opus5, claude_cli_opus4.6,
# codex_gpt6-astra, cursor_composer2.5).
# Rules are ratio-based (parser interprets "N/M" as N/M fraction applied
# to successful count), so the literal numerator/denominator is
# informational; what matters is the ratio.
convergence_rule: "3/4 APPROVE"  # ceil(4 * 0.6) = 3 of the 4-reviewer roster
min_quorum: 2                    # minimum successful reviews for any verdict

# Self-referential orchestrator exclusion.
# When the caller passes orchestrator_model (e.g. "claude-opus-5"), any
# roster entry with that exact model is dropped before dispatch — the
# orchestrator should not review its own output.
# Under the "exclude" strategy, when at least one entry is excluded,
# convergence_rule_after_exclusion replaces convergence_rule for that
# dispatch (the literal rule for the full roster would otherwise be too
# strict for the reduced count). The "subprocess" strategy keeps the full
# roster; the default "delegate" strategy re-adds the slot at collect, so
# the full-roster rule governs there.
exclude_orchestrator_model: true

# Default orchestrator_strategy when the caller does not specify one.
# "delegate" (default): orchestrator runs persona Agent Team review in its own
#   context, in parallel with subprocess reviewers (detached worker). Empirically
#   same-model persona review still surfaces findings subprocess-only misses
#   because LLM metacognition is structurally limited.
# "exclude": legacy behavior — drop the matching reviewer entirely.
# "subprocess": spawn fresh claude -p for the matching reviewer.
default_orchestrator_strategy: "delegate"
# After excluding 1 orchestrator from 4 → 3 reviewers. Same ceil(N * 0.6)
# majority basis (ceil(3 * 0.6) = 2 → 2 of 3 must APPROVE). The two rules are
# not the same literal ratio (3/4 = 0.75 vs 2/3 = 0.67); since the parser
# applies the ratio to the successful count, they diverge when some reviewers
# fail. Accepted as-is, and cheaply so now: both values are reference figures,
# not gates.
# Applies to the "exclude" strategy only — "subprocess" keeps the full
# roster, and "delegate" re-adds the orchestrator slot at collect, so the
# full-roster rule (3/4) governs both (verified live 2026-06-10).
convergence_rule_after_exclusion: "2/3 APPROVE"

# Two-phase delegation (orchestrator_strategy: "delegate").
# Phase 1 dispatches subprocess reviewers synchronously, persists their
# results under a UUID v4 token, and returns a delegation manifest.
# Phase 2 (multi_llm_review_collect) receives the orchestrator's persona
# team review and computes final consensus.
delegation:
  collect_deadline_seconds: 1800 # how long the orchestrator has to call collect (30min — interactive runs often have user dialogue between Phase 1 and collect)
  retain_collected_seconds: 3600 # how long collected results stay for idempotent replay
  # v0.3.0 parallel subprocess worker (Phase 11.5). When default:true, Phase 1
  # returns a delegation_pending token immediately and a detached OS worker
  # runs subprocess reviewers in parallel with orchestrator persona Agents.
  # Budget constraint:
  #   collect_max_wait_seconds >
  #     main_call_max_timeout_seconds + main_call_timeout_margin_seconds
  #     + poll_interval_seconds × 20
  # else healthy long reviewers get reaped as worker_timeout.
  parallel:
    default: true
    startup_grace_seconds: 30
    heartbeat_interval_seconds: 2
    heartbeat_stale_threshold_seconds: 15      # pulse-based liveness ceiling
    tick_stale_threshold_seconds: 30           # main-thread liveness (pulse gating)
    collect_max_wait_seconds: 420              # R4 C3a: > worker pulse budget
    poll_interval_seconds: 0.5
    suspend_detection_jump_seconds: 5
    worker_log_max_bytes: 1048576
    worker_log_rotate_check_seconds: 1
    reaper_graceful_wait_seconds: 3
    reaper_esrch_confirm_count: 2
    worker_self_timeout_multiplier: 1.5
    worker_self_timeout_floor_seconds: 60
    main_call_max_timeout_seconds: 300
    main_call_timeout_margin_seconds: 60
    # multi_llm_review_wait tool (Phase 1.5) — see tools/multi_llm_review_wait.rb
    wait_poll_interval_seconds: 1.0           # wait tool polling cadence (separate from collect's 0.5s)
    wait_max_default_seconds: 600             # default per-call blocking ceiling
    wait_max_hard_cap_seconds: 1800           # per-call hard cap (clamps max_wait_seconds arg)
    wait_still_pending_streak_limit: 3        # consecutive still_pending returns before crashed/wait_exhausted

# Dispatch settings
timeout_seconds: 600              # global deadline for all reviewers
                                  # (raised 300 -> 600 on 2026-06-10: live 6-roster
                                  # run took 381s wall-clock with max_concurrent: 2)
max_concurrent: 2                 # semaphore limit (2 for laptop, 4 for CI)

# Reviewer roster
# Each entry names a provider (maps to an llm_client adapter) and the model it
# calls. Both are required: a slot that omits the model inherits whatever the
# external CLI happens to default to, which is user-editable and outside this
# repository — that is how a recorded role label and the answering model came
# apart on 2026-07-27. A slot without a model is refused rather than warned
# about, so an omission stops the run instead of quietly changing who reviewed.
# effort is optional. role_label is used in consensus output.
#
# Default effort per reviewer (high baseline since 2026-09-05). When the
# multi_llm_review tool receives a `complexity` argument (or auto-detects it),
# these defaults are overridden per-dispatch by the effort_map below — so the
# effort_map is the value that actually reaches the CLI, and both are set to
# high. A roster entry left at medium here would be silently raised by the map.
#
# Cursor entries carry no `effort` key on purpose: cursor_adapter has no effort
# handling at all, so the key would be accepted here and dropped at dispatch,
# recording an effort the run never used.
reviewers:
  # Rotating orchestrator slots (Opus 5 / Fable 5, 2026-07-25).
  # Both frontier Claude models sit in the roster. Whichever one is the
  # session orchestrator matches orchestrator_model and, under the default
  # "delegate" strategy, is replaced by that orchestrator's own persona
  # Agent Team review; the other is dispatched as a `claude -p` subprocess.
  # So the Claude side is always {orchestrator persona} + {other frontier
  # model via CLI} + {Opus 4.6 via CLI} — no config branching needed.
  # role_labels are provider-neutral because either entry can end up on
  # either path; the delegated slot is relabelled claude_team_<model> by
  # PersonaAssembly at collect time.
  - provider: claude_code
    model: claude-opus-5
    effort: high
    role_label: claude_cli_opus5

  # Fable 5 retired from the roster 2026-07-26 after five consecutive
  # non-substantive returns (85-128 characters in 5-7 seconds, each an
  # opening sentence with no findings and no verdict text). The slot was
  # not producing a review, so it lowered the achievable numerator without
  # contributing signal. To restore, re-add an entry with model
  # claude-fable-5 and widen convergence_rule back to a 6-reviewer basis.
  # Consequence of the removal: the Claude CLI side is opus4.6 only when the
  # orchestrator is opus5, since the orchestrator's own slot is delegated to
  # the persona team rather than spawned as a subprocess.

  # Opus 4.6 stays for its documented complementary bias
  # (ambiguity-preserving, self-reference-friendly) — it is the calibrated
  # anchor on the Claude side, deliberately not a frontier model.
  - provider: claude_code
    model: claude-opus-4-6
    effort: high
    role_label: claude_cli_opus4.6

  # Opus 4.8 retired 2026-07-25 when Opus 5 entered the roster (same
  # succession logic that retired 4.7 on 2026-06-10: the strictness /
  # systematizing register passes to the direct successor). To restore,
  # re-add an entry with model claude-opus-4-8 and widen the convergence
  # rules to 4/7 (3/5 -> 4/6 after exclusion).
  # Opus 5's reviewer bias profile is not yet calibrated — record
  # (a)/(b)/(c) breakdowns per round (see multi_llm_reviewer_evaluation)
  # until a profile accumulates.

  # GPT-6-astra added 2026-09-05 at the operator's instruction, replacing
  # gpt-5.6-sol (which had held this slot since 2026-07-23, itself replacing
  # gpt-5.4). To restore either, set model and role_label back. Verified before
  # the swap through the flags this adapter actually builds:
  #   codex exec --sandbox read-only -m gpt-6-astra -c model_reasoning_effort=high
  # answered with `model: gpt-6-astra` / `reasoning effort: high` in its header.
  #
  # gpt-6-astra's reviewer bias profile is not calibrated — record (a)/(b)/(c)
  # breakdowns per round (see multi_llm_reviewer_evaluation) until one
  # accumulates. The 138-run profile recorded for codex_gpt5.6-sol in L1
  # multi_llm_review_workflow belongs to the retired model and does NOT carry
  # over to this slot. Since gpt-5.5 was retired the same day, codex holds ONE
  # slot and it is uncalibrated — there is no longer a calibrated codex anchor
  # to read a new seat against.
  - provider: codex
    model: gpt-6-astra
    effort: high
    role_label: codex_gpt6-astra

  # GPT-5.5 (added 2026-04-24) RETIRED 2026-09-05 at the operator's
  # instruction. It had held the second codex slot as the calibrated
  # cross-generation anchor. In practice it had not run since 2026-07-30, when
  # it was commented out of the instance roster "for round R10 only" and never
  # restored — so the anchor role it was kept for had already lapsed for five
  # weeks before this made the lapse explicit. The roster drops from 5 to 4 and
  # codex now holds one slot, gpt-6-astra.
  #
  # To restore, re-add an entry with model gpt-5.5, effort high, role_label
  # codex_gpt5.5, and widen convergence_rule back to a 5-seat basis
  # (ceil(5 * 0.6) = 3, "3/5 APPROVE"; after exclusion "3/4 APPROVE").
  #
  # Transport backend (2026-07-03), retained for whichever codex entries exist:
  # they default to the `codex exec` CLI, and the adapter passes `-m <model>` so
  # the response can be attributed per-model. Add `backend: mcp` to route a codex
  # reviewer through `codex mcp-server` instead (CodexMcpAdapter, read-only
  # sandbox). Opt-in for A/B against the CLI path; keep the default CLI until MCP
  # parity is confirmed (see log 20260702 Appendix F).

  # Model pinned explicitly 2026-07-27. This entry previously carried no
  # `model` key and relied on the cursor CLI default, which is user-editable
  # (~/.cursor/cli-config.json) and had been changed to claude-opus-4-8. The
  # roster then silently ran three Anthropic slots out of five while still
  # labelling this one cursor_composer2.5, so provider diversity was lost and
  # the recorded label no longer matched the model that answered. Pinning the
  # model makes the roster independent of the CLI default.
  - provider: cursor
    model: composer-2.5
    role_label: cursor_composer2.5

  # ----------------------------------------------------------------------
  # Multi-model cursor option (Phase 12 PR3-β, available since v3.22.1).
  # cursor_adapter passes --model when set. To run all reviewers via Cursor
  # (e.g., when only Cursor login is available), add entries below and
  # disable other providers' entries above. Models supported by `agent`
  # depend on your Cursor subscription/CLI version. Verified examples:
  #   - composer-2.5
  #   - gpt-5.4-high
  #   - claude-sonnet-4-6 (if available)
  # role_label is what shows up in convergence output.
  # ----------------------------------------------------------------------
  # - provider: cursor
  #   model: gpt-5.4-high
  #   role_label: cursor_gpt5.4
  # - provider: cursor
  #   model: claude-sonnet-4-6
  #   role_label: cursor_sonnet4.6

# Reserve observers (INV-E3).
#
# These are not part of the roster above. They join only when a caller passes
# escalate: true, which it does for an artifact it judges hard enough to be
# worth extra observers — the judgement is the caller's, and this SkillSet
# does not try to infer it.
#
# The container is provider-neutral on purpose. Its first intended occupant
# (Fable 5) depends on a subscription that may end, and the point of writing
# it as a container rather than as a place for one model is that the design
# survives that. To retire the container, delete these lines; a caller that
# still passes escalate: true then simply gets the roster.
#
# Adding an observer raises the required agreement, because the convergence
# rule is a ratio applied to the denominator.
#
# NOTE on the first occupant: Fable 5 was retired from the roster on
# 2026-07-26 for returning 85-128 characters with no verdict and no findings,
# five rounds running — not for cost. That reply shape is now kept out of the
# denominator by the no-verdict half of INV-E2, not by the substance half: it
# has plenty of text, so a residue rule counts it. An earlier version of this
# comment claimed the substance rule handled it; that was false, and it was
# false in the direction that invites restoring the occupant. Whether the slot
# contributes anything remains unproven — try one round and read the output
# before relying on it.
escalation_reviewers:
  - provider: claude_code
    model: claude-fable-5
    effort: high
    role_label: claude_cli_fable5

# INV-E2 (substance) has no setting here on purpose. A reply counts as a review
# when anything remains once its verdict is removed, and that is the whole rule.
# Three earlier versions expressed it as a character floor and each broke in a
# different direction; the last one discarded Japanese reviews, which is how a
# tunable number reveals that it encodes a language rather than a threshold.
# See lib/multi_llm_review/consensus.rb for what the rule can and cannot do.

# Complexity → per-provider effort mapping.
# multi_llm_review tool auto-detects complexity from review_type + artifact size,
# or accepts an explicit `complexity` input. The mapped effort overrides the
# reviewer roster's default.
#
# Policy (2026-09-05, operator instruction): every reviewer that HAS an effort
# control runs at high, at every complexity level. Effort is therefore a
# constant here, not a function of complexity; the map is kept rather than
# deleted because deleting it would silently hand control back to the roster
# entries, which is a second place to forget.
#
# This SUPERSEDES the 2026-04-29 policy ("reviewers stay at each LLM's default
# effort; verdict quality is effort-independent"). That policy rested on a
# cross-evaluation measurement of low vs high scoring 8.35 vs 8.16 — taken on
# the Opus 4.6 / 4.7 generation, on none of the models now in the roster. It was
# not re-measured against Opus 5 or gpt-6-astra, so it is superseded on the
# operator's judgement rather than on a counter-measurement. Cost rises:
# gpt-6-astra spent 8,274 tokens at high vs 3,150 at its default on the same
# one-line prompt (measured 2026-09-05).
#
# `cursor` deliberately has no key at any level. cursor_adapter builds no effort
# flag, so a value here would be recorded and never sent.
effort_map:
  low:
    claude_code: high
    codex: high
  medium:
    claude_code: high
    codex: high
  high:
    claude_code: high
    codex: high
  critical:
    claude_code: high   # `high` is the ceiling the two providers share: claude
                        # accepts low/medium/high/xhigh/max, codex accepts
                        # minimal/low/medium/high. Raising this level alone
                        # would split the roster across incomparable settings.
    codex: high

# Auto-detection thresholds (used when complexity arg not given)
# Note: per the policy above, all complexity levels currently map to high for
# reviewers, so detected complexity changes nothing about effort today. The
# thresholds remain so that explicit `complexity` inputs and future per-pool
# overrides (e.g. revision-phase callers) can still differentiate.
auto_complexity:
  small_artifact_chars: 500
  large_artifact_chars: 5000
  document_review_type: medium
  design_review_type: medium   # was: high — reviewers default per new policy

# Review context default
# 'independent' = reviewers don't see CLAUDE.md, project instructions
# 'project_aware' = reviewers see project context (use for project-specific reviews)
default_review_context: independent
