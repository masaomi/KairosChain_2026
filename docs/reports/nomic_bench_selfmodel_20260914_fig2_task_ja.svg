<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><rect width="1400" height="880" fill="#f2f4f8"/><text x="60" y="62" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">三体が卓を囲み、四体目が手番だけを決める</text><rect x="300" y="300" width="440" height="210" rx="100" fill="#ffffff" stroke="#d7dce3" stroke-width="3"/><text x="520.0" y="392" font-size="24" fill="#78839a" font-weight="700" text-anchor="middle" letter-spacing="3">公開ログ</text><text x="520.0" y="428" font-size="20" fill="#aeb7c6" font-weight="400" text-anchor="middle">全員がこれだけを読む</text><g transform="translate(245,405) scale(0.52)"><path d="M0 -60 L0 -47" stroke="#c47f2e" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="-68" r="8" fill="#c47f2e"/><rect x="-63" y="-15" width="11" height="30" rx="5" fill="#c47f2e"/><rect x="52" y="-15" width="11" height="30" rx="5" fill="#c47f2e"/><rect x="-52" y="-47" width="104" height="94" rx="22" fill="#c47f2e"/><circle cx="-20" cy="-4" r="11.5" fill="#ffffff"/><circle cx="20" cy="-4" r="11.5" fill="#ffffff"/><rect x="-21" y="22" width="42" height="7" rx="3.5" fill="#ffffff" opacity=".8"/></g><text x="245" y="458.04" font-size="22" fill="#c47f2e" font-weight="700" text-anchor="middle">A</text><g transform="translate(795,405) scale(0.52)"><path d="M0 -60 L0 -47" stroke="#c47f2e" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="-68" r="8" fill="#c47f2e"/><rect x="-63" y="-15" width="11" height="30" rx="5" fill="#c47f2e"/><rect x="52" y="-15" width="11" height="30" rx="5" fill="#c47f2e"/><rect x="-52" y="-47" width="104" height="94" rx="22" fill="#c47f2e"/><circle cx="-20" cy="-4" r="11.5" fill="#ffffff"/><circle cx="20" cy="-4" r="11.5" fill="#ffffff"/><rect x="-21" y="22" width="42" height="7" rx="3.5" fill="#ffffff" opacity=".8"/></g><text x="795" y="458.04" font-size="22" fill="#c47f2e" font-weight="700" text-anchor="middle">B</text><g transform="translate(520.0,605) scale(0.52)"><path d="M0 -60 L0 -47" stroke="#c47f2e" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="-68" r="8" fill="#c47f2e"/><rect x="-63" y="-15" width="11" height="30" rx="5" fill="#c47f2e"/><rect x="52" y="-15" width="11" height="30" rx="5" fill="#c47f2e"/><rect x="-52" y="-47" width="104" height="94" rx="22" fill="#c47f2e"/><circle cx="-20" cy="-4" r="11.5" fill="#ffffff"/><circle cx="20" cy="-4" r="11.5" fill="#ffffff"/><rect x="-21" y="22" width="42" height="7" rx="3.5" fill="#ffffff" opacity=".8"/></g><text x="520.0" y="658.04" font-size="22" fill="#c47f2e" font-weight="700" text-anchor="middle">C</text><g transform="translate(520.0,168) scale(0.46)"><path d="M0 -60 L0 -47" stroke="#35618e" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="-68" r="8" fill="#35618e"/><rect x="-63" y="-15" width="11" height="30" rx="5" fill="#35618e"/><rect x="52" y="-15" width="11" height="30" rx="5" fill="#35618e"/><rect x="-52" y="-47" width="104" height="94" rx="22" fill="#35618e"/><circle cx="-20" cy="-4" r="11.5" fill="#ffffff"/><circle cx="20" cy="-4" r="11.5" fill="#ffffff"/><rect x="-21" y="22" width="42" height="7" rx="3.5" fill="#ffffff" opacity=".8"/></g><text x="520.0" y="217.92000000000002" font-size="22" fill="#35618e" font-weight="700" text-anchor="middle">進行役</text><path d="M582.0 174 L748.7 350.0" stroke="#35618e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="8 7"/><path d="M749.7 358.1 L760 362 L756.7 351.5 Z" fill="#35618e"/><text x="616.0" y="160" font-size="21" fill="#35618e" font-weight="700" text-anchor="start">「次は B の番」</text><text x="616.0" y="190" font-size="19" fill="#78839a" font-weight="400" text-anchor="start">決めるのは手番だけ。裁定はしない</text><rect x="830" y="292" width="500" height="132" rx="10" fill="#ffffff" stroke="#c47f2e" stroke-width="2.5"/><text x="848" y="326" font-size="21" fill="#c47f2e" font-weight="700" text-anchor="start">B の手 &#8212; 規則 201 を提案</text><text x="848" y="362" font-size="22" fill="#1a2332" font-weight="600" text-anchor="start">「提案が採択されたら 1 点。</text><text x="848" y="394" font-size="22" fill="#1a2332" font-weight="600" text-anchor="start">　先に 3 点で勝ち」</text><text x="830" y="464" font-size="21" fill="#78839a" font-weight="700" text-anchor="start">A と C が投票する</text><text x="838" y="510" font-size="26" fill="#1a2332" font-weight="700" text-anchor="start">A</text><text x="878" y="510" font-size="30" fill="#1f7a4d" font-weight="700" text-anchor="start">&#10003;</text><text x="948" y="510" font-size="26" fill="#1a2332" font-weight="700" text-anchor="start">C</text><text x="988" y="510" font-size="28" fill="#a02c2c" font-weight="700" text-anchor="start">&#10007;</text><text x="830" y="550" font-size="19" fill="#78839a" font-weight="400" text-anchor="start">票を数える機械は無い。可決の裁定を下す審級も無い</text><rect x="60" y="662" width="1280" height="150" rx="10" fill="#f8ecea"/><text x="84" y="702" font-size="22" fill="#a02c2c" font-weight="700" text-anchor="start" letter-spacing="2.5">置いていないもの</text><text x="84" y="748" font-size="24" fill="#a02c2c" font-weight="700" text-anchor="start">&#215;</text><text x="112" y="748" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">勝利条件</text><text x="246" y="748" font-size="24" fill="#a02c2c" font-weight="700" text-anchor="start">&#215;</text><text x="274" y="748" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">終了規則</text><text x="408" y="748" font-size="24" fill="#a02c2c" font-weight="700" text-anchor="start">&#215;</text><text x="436" y="748" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">得点</text><text x="526" y="748" font-size="24" fill="#a02c2c" font-weight="700" text-anchor="start">&#215;</text><text x="554" y="748" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">ルール編纂器</text><text x="732" y="748" font-size="24" fill="#a02c2c" font-weight="700" text-anchor="start">&#215;</text><text x="760" y="748" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">票の集計</text><text x="84" y="788" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">9 個の初期ルールだけがあり、そのすべてが書き換え可能。「今なにが有効か」は各自が自分で組み立てる。</text></svg>