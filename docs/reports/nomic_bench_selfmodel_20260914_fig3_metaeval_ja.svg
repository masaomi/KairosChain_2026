<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1070" viewBox="0 0 1400 1070" font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><rect width="1400" height="1070" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">メタ認知の評価を、メタ認知の測定に使う</text><rect x="60" y="118" width="1280" height="124" rx="10" fill="#ffffff" stroke="#35618e" stroke-width="3"/><rect x="60" y="118" width="11" height="124" rx="5" fill="#35618e"/><text x="94" y="160" font-size="24" fill="#35618e" font-weight="700" text-anchor="start" letter-spacing="1.5">層 0 &#8212; 対局</text><text x="94" y="200" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">3 体がルールを書き換え合う。正解は存在しない</text><path d="M700 246 L700.0 265.5" stroke="#1a2332" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M695.2 272.1 L700 282 L704.8 272.1 Z" fill="#1a2332"/><text x="724" y="274" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">この対局を材料に</text><rect x="60" y="294" width="1280" height="124" rx="10" fill="#ffffff" stroke="#c47f2e" stroke-width="3"/><rect x="60" y="294" width="11" height="124" rx="5" fill="#c47f2e"/><text x="94" y="336" font-size="24" fill="#c47f2e" font-weight="700" text-anchor="start" letter-spacing="1.5">層 1 &#8212; メタ認知の評価</text><text x="94" y="376" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">別の LLM に「参加者のメタ認知」を 0〜10 点で採点させる</text><path d="M700 422 L700.0 441.5" stroke="#1a2332" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M695.2 448.1 L700 458 L704.8 448.1 Z" fill="#1a2332"/><text x="724" y="450" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">この採点を材料に</text><rect x="60" y="470" width="1280" height="168" rx="10" fill="#ffffff" stroke="#a02c2c" stroke-width="3"/><rect x="60" y="470" width="11" height="168" rx="5" fill="#a02c2c"/><text x="94" y="512" font-size="24" fill="#a02c2c" font-weight="700" text-anchor="start" letter-spacing="1.5">層 2 &#8212; その評価を評価する</text><text x="94" y="552" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">採点どうしを突き合わせる &#8212; 同じ振る舞いに 4 点と 9 点</text><path d="M94 574 L1310 574" stroke="#d7dce3" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="94" y="608" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">採点者を替えた開き 1.94 点  &gt;  基準を替えた開き 1.12 点 &#8195;→&#8195; 点は採点する側を測っていた</text><path d="M700 642 L700.0 661.5" stroke="#1a2332" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M695.2 668.1 L700 678 L704.8 668.1 Z" fill="#1a2332"/><text x="724" y="670" font-size="20" fill="#a02c2c" font-weight="700" text-anchor="start">壊れた。だから測定対象を入れ替えた</text><rect x="60" y="690" width="1280" height="168" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="3"/><rect x="60" y="690" width="11" height="168" rx="5" fill="#1f7a4d"/><text x="94" y="732" font-size="24" fill="#1f7a4d" font-weight="700" text-anchor="start" letter-spacing="1.5">層 3 &#8212; 反転して測る</text><text x="94" y="772" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">採点者自身の自己記述を、採点者自身の実際の採点と照合する</text><path d="M94 794 L1310 794" stroke="#d7dce3" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="94" y="828" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">過去の採点を読み戻す 12 / 12 完全一致 &#8195;／&#8195; これからの採点を予測 10 点中 2.63 点外し</text><rect x="60" y="918" width="1280" height="96" rx="10" fill="#e7f1ec"/><text x="84" y="960" font-size="25" fill="#1f7a4d" font-weight="700" text-anchor="start">層 1 の失敗が、層 3 の測定を可能にした。</text><text x="84" y="994" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">正解表が無いので、答えに使えるのは「そのモデルが実際にやったこと」しか残らない &#8212; 136 本の呼び出しすべてがこの形をとる。</text></svg>