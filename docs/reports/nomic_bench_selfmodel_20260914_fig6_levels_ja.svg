<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="736" viewBox="0 0 1400 736" font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><rect width="1400" height="736" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">自己モデルの三つのレベル</text><text x="60" y="96" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">「LLM は自己モデルを持っているか」の答えが割れるのは、この三つのどれを指すかが違うから</text><rect x="60" y="140" width="1280" height="140" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="3"/><rect x="60" y="140" width="11" height="140" rx="5" fill="#1f7a4d"/><text x="96" y="184" font-size="34" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">1</text><text x="146" y="184" font-size="26" fill="#1a2332" font-weight="700" text-anchor="start">話者のモデル</text><text x="1316" y="184" font-size="25" fill="#1f7a4d" font-weight="700" text-anchor="end">在る</text><text x="146" y="220" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">「これは自分の書き方だ」がわかる</text><text x="146" y="258" font-size="27" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0 / 198</text><text x="276" y="258" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">他人の文を自分のだと誤認した数</text><text x="700" y="258" font-size="27" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">22 / 22</text><text x="830" y="258" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">著者ごとの仕分け（1 体でのみ確認）</text><rect x="60" y="306" width="1280" height="96" rx="10" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><rect x="60" y="306" width="11" height="96" rx="5" fill="#aeb7c6"/><text x="96" y="350" font-size="34" fill="#aeb7c6" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2</text><text x="146" y="350" font-size="26" fill="#aeb7c6" font-weight="700" text-anchor="start">自分についての知識</text><text x="1316" y="350" font-size="25" fill="#aeb7c6" font-weight="700" text-anchor="end">試していない</text><text x="146" y="384" font-size="21" fill="#aeb7c6" font-weight="400" text-anchor="start">「私は Claude で、Anthropic が作った」 &#8212; 暗記であって鏡ではない</text><rect x="60" y="428" width="1280" height="202" rx="10" fill="#ffffff" stroke="#a02c2c" stroke-width="3"/><rect x="60" y="428" width="11" height="202" rx="5" fill="#a02c2c"/><text x="96" y="472" font-size="34" fill="#a02c2c" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">3</text><text x="146" y="472" font-size="26" fill="#1a2332" font-weight="700" text-anchor="start">自分の計算についてのモデル</text><text x="1316" y="472" font-size="25" fill="#a02c2c" font-weight="700" text-anchor="end">材料しだい</text><text x="146" y="508" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">出力する前に、自分はこう振る舞うとわかる &#8212; ふつう「メタ認知」が指すのはここ</text><text x="158" y="562" font-size="22" fill="#78839a" font-weight="400" text-anchor="start">材料なし ── これから自分がつける点を予測する</text><text x="1300" y="562" font-size="25" fill="#a02c2c" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">4 体中 3 体が 1.5〜2.6 点外し</text><rect x="138" y="576" width="1180" height="42" rx="6" fill="#e7f1ec"/><text x="158" y="606" font-size="22" fill="#1a2332" font-weight="700" text-anchor="start">材料あり ── 自分が過去につけた点を読み戻す</text><text x="1300" y="606" font-size="25" fill="#1f7a4d" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">48 点中 41 点が完全一致</text></svg>