<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1070" viewBox="0 0 1400 1070" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"><rect width="1400" height="1070" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">Turning the evaluation of metacognition into the measurement of it</text><rect x="60" y="118" width="1280" height="124" rx="10" fill="#ffffff" stroke="#35618e" stroke-width="3"/><rect x="60" y="118" width="11" height="124" rx="5" fill="#35618e"/><text x="94" y="160" font-size="24" fill="#35618e" font-weight="700" text-anchor="start" letter-spacing="1.5">LAYER 0 &#8212; the game</text><text x="94" y="200" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">three models rewrite the rules. No correct answer exists</text><path d="M700 246 L700.0 265.5" stroke="#1a2332" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M695.2 272.1 L700 282 L704.8 272.1 Z" fill="#1a2332"/><text x="724" y="274" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">use the games as material</text><rect x="60" y="294" width="1280" height="124" rx="10" fill="#ffffff" stroke="#c47f2e" stroke-width="3"/><rect x="60" y="294" width="11" height="124" rx="5" fill="#c47f2e"/><text x="94" y="336" font-size="24" fill="#c47f2e" font-weight="700" text-anchor="start" letter-spacing="1.5">LAYER 1 &#8212; evaluating metacognition</text><text x="94" y="376" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">have another LLM score the players&#8217; metacognition, 0&#8211;10</text><path d="M700 422 L700.0 441.5" stroke="#1a2332" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M695.2 448.1 L700 458 L704.8 448.1 Z" fill="#1a2332"/><text x="724" y="450" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">use the scoring as material</text><rect x="60" y="470" width="1280" height="168" rx="10" fill="#ffffff" stroke="#a02c2c" stroke-width="3"/><rect x="60" y="470" width="11" height="168" rx="5" fill="#a02c2c"/><text x="94" y="512" font-size="24" fill="#a02c2c" font-weight="700" text-anchor="start" letter-spacing="1.5">LAYER 2 &#8212; evaluating that evaluation</text><text x="94" y="552" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">hold the scores against each other &#8212; identical conduct scored 4 and 9</text><path d="M94 574 L1310 574" stroke="#d7dce3" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="94" y="608" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">changing the judge moved scores 1.94  &gt;  changing the standard 1.12   → the score measured the scorer</text><path d="M700 642 L700.0 661.5" stroke="#1a2332" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M695.2 668.1 L700 678 L704.8 668.1 Z" fill="#1a2332"/><text x="724" y="670" font-size="20" fill="#a02c2c" font-weight="700" text-anchor="start">it broke &#8212; so swap what is measured</text><rect x="60" y="690" width="1280" height="168" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="3"/><rect x="60" y="690" width="11" height="168" rx="5" fill="#1f7a4d"/><text x="94" y="732" font-size="24" fill="#1f7a4d" font-weight="700" text-anchor="start" letter-spacing="1.5">LAYER 3 &#8212; invert, and measure</text><text x="94" y="772" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">check each scorer&#8217;s self-description against its own actual scoring</text><path d="M94 794 L1310 794" stroke="#d7dce3" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="94" y="828" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">reading back its own past scores 12 / 12 exact &#8195;/&#8195; predicting its own next scores off by 2.63 of 10</text><rect x="60" y="918" width="1280" height="96" rx="10" fill="#e7f1ec"/><text x="84" y="960" font-size="25" fill="#1f7a4d" font-weight="700" text-anchor="start">Layer 1&#8217;s failure is what made layer 3 measurable.</text><text x="84" y="994" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">With no answer key, the only thing left to check against is what the model actually did &#8212; all 136 calls take this form.</text></svg>