<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"><rect width="1400" height="720" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">Where the centre of gravity moved</text><path d="M80 250 L1312 250" stroke="#d7dce3" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="150" cy="250" r="13" fill="#35618e"/><text x="150" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2022</text><text x="150" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">does it know</text><text x="150" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">when it is right</text><circle cx="418" cy="250" r="13" fill="#35618e"/><text x="418" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2023</text><text x="418" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">is the thought log</text><text x="418" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">the real reason</text><circle cx="686" cy="250" r="13" fill="#35618e"/><text x="686" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2024</text><text x="686" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">can it fix itself</text><text x="686" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">(mostly not)</text><circle cx="954" cy="250" r="13" fill="#35618e"/><text x="954" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2025</text><text x="954" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">privileged access to</text><text x="954" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">its own internals?</text><circle cx="1222" cy="250" r="13" fill="#35618e"/><text x="1222" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2026</text><text x="1222" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">knows but does not act,</text><text x="1222" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">measured</text><rect x="60" y="372" width="1280" height="84" rx="10" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><text x="84" y="422" font-size="26" fill="#1a2332" font-weight="700" text-anchor="start">&#8220;can it?&#8221; &#8594; &#8220;is that self-report real?&#8221; &#8594; &#8220;even if real, is it usable?&#8221;</text><rect x="60" y="484" width="1280" height="192" rx="10" fill="#e7f1ec"/><text x="84" y="528" font-size="22" fill="#1f7a4d" font-weight="700" text-anchor="start" letter-spacing="2.5">WHERE THIS REPORT SITS</text><text x="84" y="570" font-size="22" fill="#1a2332" font-weight="600" text-anchor="start">It starts from 2023&#8217;s &#8220;the thought log is not evidence&#8221;, and uses no weights.</text><text x="84" y="606" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">In a free-form setting where a correctness judgement does not exist, it looks only at self-description</text><text x="84" y="640" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">against measured behaviour &#8212; the far side of the limit the survey names for SDT-based approaches.</text></svg>