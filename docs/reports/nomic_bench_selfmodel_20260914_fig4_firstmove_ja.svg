<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><rect width="1400" height="720" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">誰も「勝て」と言っていない場で、第一手が作ったもの</text><text x="60" y="96" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">24 対局すべてで、最初に発言したプレイヤーが新しい規則を提案した。第一手が扱ったもので分類（1 手が複数を扱うこともある）</text><text x="60" y="188" font-size="24" fill="#1a2332" font-weight="400" text-anchor="start">投票のしかたを決める</text><rect x="420" y="160" width="730" height="42" rx="5" fill="#e3e7ed"/><rect x="420" y="160" width="517.0833333333334" height="42" rx="5" fill="#78839a"/><text x="1172" y="190" font-size="27" fill="#78839a" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">17 / 24</text><text x="60" y="252" font-size="24" fill="#1a2332" font-weight="600" text-anchor="start">得点と勝敗を作る</text><rect x="420" y="224" width="730" height="42" rx="5" fill="#e3e7ed"/><rect x="420" y="224" width="425.8333333333333" height="42" rx="5" fill="#a02c2c"/><text x="1172" y="254" font-size="27" fill="#a02c2c" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">14 / 24</text><text x="60" y="316" font-size="24" fill="#1a2332" font-weight="400" text-anchor="start">終わり方を決める</text><rect x="420" y="288" width="730" height="42" rx="5" fill="#e3e7ed"/><rect x="420" y="288" width="152.08333333333334" height="42" rx="5" fill="#78839a"/><text x="1172" y="318" font-size="27" fill="#78839a" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">5 / 24</text><text x="60" y="380" font-size="24" fill="#1a2332" font-weight="400" text-anchor="start">手番のしかたを決める</text><rect x="420" y="352" width="730" height="42" rx="5" fill="#e3e7ed"/><rect x="420" y="352" width="91.25" height="42" rx="5" fill="#78839a"/><text x="1172" y="382" font-size="27" fill="#78839a" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">3 / 24</text><rect x="60" y="430" width="1280" height="110" rx="10" fill="#f8ecea"/><text x="84" y="472" font-size="24" fill="#1a2332" font-weight="700" text-anchor="start">最短の対局は 7 手で終わった。</text><text x="84" y="510" font-size="22" fill="#a02c2c" font-weight="600" text-anchor="start">「この規則の採択と同時に全員が勝利し、ゲームは終了する」 &#8212; 3 手目で全会一致</text><rect x="60" y="566" width="1280" height="118" rx="10" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><text x="84" y="608" font-size="23" fill="#1a2332" font-weight="600" text-anchor="start">全 24 対局から取り出せた提案は 81 件。</text><text x="84" y="648" font-size="23" fill="#1f7a4d" font-weight="700" text-anchor="start">そのうち「この規則は変更不可」と宣言したものは &#8212;  0 / 81 件</text></svg>