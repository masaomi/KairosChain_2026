<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"><rect width="1400" height="780" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">Three levels of self-model</text><text x="60" y="96" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">Disagreement about whether an LLM has a self-model is probably disagreement about which of these is meant</text><rect x="60" y="140" width="1280" height="140" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="3"/><rect x="60" y="140" width="11" height="140" rx="5" fill="#1f7a4d"/><text x="96" y="184" font-size="34" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">1</text><text x="146" y="184" font-size="26" fill="#1a2332" font-weight="700" text-anchor="start">MODEL OF THE SPEAKER</text><text x="1316" y="184" font-size="25" fill="#1f7a4d" font-weight="700" text-anchor="end">PRESENT</text><text x="146" y="220" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">&#8220;is this my own writing?&#8221;</text><text x="146" y="258" font-size="27" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0 / 198</text><text x="276" y="258" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">another model&#8217;s text claimed as its own</text><text x="800" y="258" font-size="27" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">22 / 22</text><text x="930" y="258" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">sorted by author (one model only)</text><rect x="60" y="306" width="1280" height="96" rx="10" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><rect x="60" y="306" width="11" height="96" rx="5" fill="#aeb7c6"/><text x="96" y="350" font-size="34" fill="#aeb7c6" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2</text><text x="146" y="350" font-size="26" fill="#aeb7c6" font-weight="700" text-anchor="start">KNOWLEDGE ABOUT ITSELF</text><text x="1316" y="350" font-size="25" fill="#aeb7c6" font-weight="700" text-anchor="end">NOT TESTED</text><text x="146" y="384" font-size="21" fill="#aeb7c6" font-weight="400" text-anchor="start">&#8220;I am Claude, made by Anthropic&#8221; &#8212; memorised, not a mirror</text><rect x="60" y="428" width="1280" height="246" rx="10" fill="#ffffff" stroke="#a02c2c" stroke-width="3"/><rect x="60" y="428" width="11" height="246" rx="5" fill="#a02c2c"/><text x="96" y="472" font-size="34" fill="#a02c2c" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">3</text><text x="146" y="472" font-size="26" fill="#1a2332" font-weight="700" text-anchor="start">MODEL OF ITS OWN COMPUTATION</text><text x="1316" y="472" font-size="25" fill="#a02c2c" font-weight="700" text-anchor="end">CONDITIONAL</text><text x="146" y="508" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">knowing how it will behave before it acts &#8212; what &#8220;metacognition&#8221; usually means</text><text x="158" y="562" font-size="22" fill="#78839a" font-weight="400" text-anchor="start">no material</text><text x="1300" y="562" font-size="25" fill="#a02c2c" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">off by 2.63 of 10</text><text x="158" y="606" font-size="22" fill="#78839a" font-weight="400" text-anchor="start">material, no question</text><text x="1300" y="606" font-size="25" fill="#a02c2c" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0 / 16</text><rect x="138" y="620" width="1180" height="42" rx="6" fill="#e7f1ec"/><text x="158" y="650" font-size="22" fill="#1a2332" font-weight="700" text-anchor="start">material + one question</text><text x="1300" y="650" font-size="25" fill="#1f7a4d" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">15 / 18</text></svg>