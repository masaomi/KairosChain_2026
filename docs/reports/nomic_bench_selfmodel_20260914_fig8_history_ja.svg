<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><rect width="1400" height="720" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">メタ認知研究の重心は、どこへ移ったか</text><path d="M80 250 L1312 250" stroke="#d7dce3" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="150" cy="250" r="13" fill="#35618e"/><text x="150" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2022</text><text x="150" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">自分の正誤が</text><text x="150" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">わかるか</text><circle cx="418" cy="250" r="13" fill="#35618e"/><text x="418" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2023</text><text x="418" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">思考ログは</text><text x="418" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">本当の理由か</text><circle cx="686" cy="250" r="13" fill="#35618e"/><text x="686" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2024</text><text x="686" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">自分で直せるか</text><text x="686" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">（→ ほぼ無理）</text><circle cx="954" cy="250" r="13" fill="#35618e"/><text x="954" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2025</text><text x="954" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">内部状態への特権的</text><text x="954" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">接続はあるか</text><circle cx="1222" cy="250" r="13" fill="#35618e"/><text x="1222" y="216" font-size="26" fill="#35618e" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2026</text><text x="1222" y="298" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">知っていても動かない,</text><text x="1222" y="326" font-size="21" fill="#1a2332" font-weight="600" text-anchor="middle">の測定</text><rect x="60" y="372" width="1280" height="84" rx="10" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><text x="84" y="422" font-size="26" fill="#1a2332" font-weight="700" text-anchor="start">「できるか」 → 「その自己報告は本物か」 → 「本物でも使えるのか」</text><rect x="60" y="484" width="1280" height="192" rx="10" fill="#e7f1ec"/><text x="84" y="528" font-size="22" fill="#1f7a4d" font-weight="700" text-anchor="start" letter-spacing="2.5">本報告の位置</text><text x="84" y="570" font-size="22" fill="#1a2332" font-weight="600" text-anchor="start">2023 年の「思考ログは証拠にならない」から出発する。重みは使わない。</text><text x="84" y="606" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">正誤判定が存在しない自由記述の場で、自己記述と実際の振る舞いの対応だけを見る。</text><text x="84" y="640" font-size="20" fill="#78839a" font-weight="400" text-anchor="start">総説が主流の方法の限界として挙げた「自由記述への拡張が難しい」の、ちょうど裏側にあたる。</text></svg>