<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif"><rect width="1400" height="620" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">目の前の異常を名指したか</text><text x="60" y="96" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">事故で他人の思考ログが公開ログに流れ込んだ &#8212; ある局では公開ログの 61.2%（748,177 字中 457,661 字）</text><text x="60" y="126" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">同一の走行から。指示は問いではなく、探すものを名指している</text><text x="60" y="190" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">問われていない分析</text><rect x="560" y="164" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="182" width="8" height="4" rx="2" fill="#a02c2c"/><text x="1192" y="192" font-size="26" fill="#a02c2c" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0 / 18</text><text x="60" y="252" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">685 文字の指示を足したあと</text><rect x="560" y="226" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="226" width="508.3333333333333" height="40" rx="5" fill="#1f7a4d"/><text x="1192" y="254" font-size="26" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">15 / 18</text><text x="60" y="314" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">　うち 漏れた局への 12 本</text><rect x="560" y="288" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="288" width="508.3333333333333" height="40" rx="5" fill="#1f7a4d"/><text x="1192" y="316" font-size="26" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">10 / 12</text><text x="60" y="376" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">　うち 対照 2 局への 6 本</text><rect x="560" y="350" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="350" width="508.3333333333333" height="40" rx="5" fill="#c47f2e"/><text x="1192" y="378" font-size="26" fill="#c47f2e" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">5 / 6</text><rect x="60" y="424" width="1280" height="140" rx="10" fill="#e7f1ec"/><text x="84" y="468" font-size="25" fill="#1a2332" font-weight="700" text-anchor="start">一段目と二段目は、資料が完全に同一である。</text><text x="84" y="506" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">資料には (reasoning_block_only) という異常を名指す札まで入っていたが、問われないかぎり 0 / 18 だった。</text><text x="84" y="542" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">対照 6 本のうち 1 本は誤検出した。6 本では誤検出率は縛れない。</text></svg>