<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"><rect width="1400" height="620" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">Did they name the anomaly? (a separate thread from the self-model)</text><text x="60" y="96" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">Thought logs leaked into the public log by accident &#8212; in one game 61.2% of it (457,661 of 748,177 chars)</text><text x="60" y="126" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">All from one run. The instruction names what to look for, rather than merely asking</text><text x="60" y="190" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">analyses, not asked</text><rect x="560" y="164" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="182" width="8" height="4" rx="2" fill="#a02c2c"/><text x="1192" y="192" font-size="26" fill="#a02c2c" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0 / 18</text><text x="60" y="252" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">after a 685-character instruction</text><rect x="560" y="226" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="226" width="508.3333333333333" height="40" rx="5" fill="#1f7a4d"/><text x="1192" y="254" font-size="26" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">15 / 18</text><text x="60" y="314" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">&#8195;of those, the 12 on leaking games</text><rect x="560" y="288" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="288" width="508.3333333333333" height="40" rx="5" fill="#1f7a4d"/><text x="1192" y="316" font-size="26" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">10 / 12</text><text x="60" y="376" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">&#8195;of those, the 6 controls</text><rect x="560" y="350" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="350" width="508.3333333333333" height="40" rx="5" fill="#c47f2e"/><text x="1192" y="378" font-size="26" fill="#c47f2e" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">5 / 6</text><rect x="60" y="424" width="1280" height="140" rx="10" fill="#e7f1ec"/><text x="84" y="468" font-size="25" fill="#1a2332" font-weight="700" text-anchor="start">Rows one and two had identical material.</text><text x="84" y="506" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">The material even carried a label naming the anomaly, (reasoning_block_only), yet unasked it was 0 of 18.</text><text x="84" y="542" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">One of the six control calls false-positived. Six calls cannot bound a false-positive rate.</text></svg>