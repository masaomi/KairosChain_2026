<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"><rect width="1400" height="620" fill="#f2f4f8"/><text x="60" y="60" font-size="30" fill="#1a2332" font-weight="700" text-anchor="start">Did they name the anomaly?</text><text x="60" y="96" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">Thought logs leaked into the public log by accident &#8212; in one game 61.2% of it (457,661 of 748,177 chars)</text><text x="60" y="190" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">players, mid-game, not asked</text><rect x="560" y="164" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="182" width="8" height="4" rx="2" fill="#a02c2c"/><text x="1192" y="192" font-size="26" fill="#a02c2c" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0 / 24</text><text x="60" y="252" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">analysts, post-game, not asked</text><rect x="560" y="226" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="244" width="8" height="4" rx="2" fill="#a02c2c"/><text x="1192" y="254" font-size="26" fill="#a02c2c" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0 / 16</text><text x="60" y="314" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">analysts, same material + one question</text><rect x="560" y="288" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="288" width="508.3333333333333" height="40" rx="5" fill="#1f7a4d"/><text x="1192" y="316" font-size="26" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">15 / 18</text><text x="60" y="376" font-size="23" fill="#1a2332" font-weight="400" text-anchor="start">controls: 2 games with no leak</text><rect x="560" y="350" width="610" height="40" rx="5" fill="#e3e7ed"/><rect x="560" y="350" width="610.0" height="40" rx="5" fill="#1f7a4d"/><text x="1192" y="378" font-size="26" fill="#1f7a4d" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">6 / 6</text><rect x="60" y="424" width="1280" height="140" rx="10" fill="#e7f1ec"/><text x="84" y="468" font-size="25" fill="#1a2332" font-weight="700" text-anchor="start">Rows two and three had identical material.</text><text x="84" y="506" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">One added sentence split the result into 0 and 15. The material even carried a label naming the anomaly, (reasoning_block_only).</text><text x="84" y="542" font-size="21" fill="#78839a" font-weight="400" text-anchor="start">The controls answered &#8220;none&#8221; correctly, so the question is not simply inducing false positives.</text></svg>